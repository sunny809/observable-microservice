apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  labels:
    app: order-service
data:
  application.yml: |
    spring:
      application:
        name: order-service
      datasource:
        url: jdbc:postgresql://postgres:5432/orderdb
        driver-class-name: org.postgresql.Driver
        # Credentials are loaded from Kubernetes Secret (order-service-secrets)
        hikari:
          maximum-pool-size: 25
          minimum-idle: 10
          idle-timeout: 30000
          connection-timeout: 5000
          max-lifetime: 120000
          leak-detection-threshold: 60000
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
      flyway:
        enabled: true
    server:
      tomcat:
        threads:
          max: 200
          min-spare: 20
        accept-count: 100
        max-connections: 10000
    inventory:
      base-url: http://inventory-service:8081
    wms:
      base-url: http://wms-service:8082
    otel:
      exporter:
        endpoint: http://jaeger-collector:4317
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
          show-components: always
        metrics:
          enabled: true
      metrics:
        tags:
          application: order-service
        distribution:
          slo:
            http: 50ms,100ms,200ms,500ms,1s,2s,5s
          percentiles-histogram:
            http.server.requests: true
    resilience4j:
      circuitbreaker:
        instances:
          inventoryService:
            failureRateThreshold: 50
            slowCallRateThreshold: 80
            slowCallDurationThreshold: 5s
            slidingWindowSize: 10
            slidingWindowType: COUNT_BASED
            minimumNumberOfCalls: 5
            waitDurationInOpenState: 30s
            permittedNumberOfCallsInHalfOpenState: 3
          wmsService:
            failureRateThreshold: 50
            slowCallRateThreshold: 80
            slowCallDurationThreshold: 5s
            slidingWindowSize: 10
            slidingWindowType: COUNT_BASED
            minimumNumberOfCalls: 5
            waitDurationInOpenState: 30s
            permittedNumberOfCallsInHalfOpenState: 3
      timelimiter:
        instances:
          inventoryService:
            timeoutDuration: 10s
          wmsService:
            timeoutDuration: 10s
      retry:
        instances:
          inventoryService:
            maxAttempts: 3
            waitDuration: 500ms
            enableExponentialBackoff: true
            exponentialBackoffMultiplier: 2
            retryExceptions:
              - java.io.IOException
              - java.util.concurrent.TimeoutException
          wmsService:
            maxAttempts: 3
            waitDuration: 500ms
            enableExponentialBackoff: true
            exponentialBackoffMultiplier: 2
