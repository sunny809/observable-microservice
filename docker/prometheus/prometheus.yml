# docker/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-demo:8080']
        labels:
          application: 'order-service'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
