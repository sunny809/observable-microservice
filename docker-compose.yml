version: '3.8'
services:
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: order-service-jaeger
    ports:
      - '6831:6831/udp'
      - '6832:6832/udp'
      - '16686:16686'
      - '4317:4317'
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'

  postgres:
    image: postgres:16-alpine
    container_name: order-service-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    volumes:
      - postgres-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order-service-zookeeper
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order-service-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data

  tms-mock:
    image: mockserver/mockserver:5.15.0
    container_name: order-service-tms-mock
    ports:
      - '8083:1080'
    environment:
      MOCKSERVER_SERVER_PORT: 1080

  prometheus:
    image: prom/prometheus:v2.45.6
    container_name: order-service-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: order-service-loki
    ports:
      - '3100:3100'
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: order-service-promtail
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.13
    container_name: order-service-grafana
    ports:
      - '3000:3000'
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/business-dashboard.json
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  loki-data:
