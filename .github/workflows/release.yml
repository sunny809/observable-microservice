name: Release

on:
  push:
    tags:
      - 'v*'           # v0.2.0-alpha, v1.0.0, etc.
      - 'o11y-kit/v*'  # o11y-kit/v0.2.0-alpha, etc.

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build o11y-kit
        run: mvn clean install -DskipTests -f o11y-kit/pom.xml -B

      - name: Build order-demo
        run: mvn clean package -DskipTests -B

      - name: List artifacts
        run: |
          echo "=== o11y-kit JARs ==="
          find o11y-kit -name '*.jar' -not -path '*/target/site/*' | sort
          echo "=== order-demo JAR ==="
          ls -lh order-infrastructure/target/*.jar 2>/dev/null || echo "No JAR found"

      - name: Create release tarball
        run: |
          mkdir -p release
          cp order-infrastructure/target/*.jar release/
          for jar in $(find o11y-kit -name '*.jar' -not -path '*/target/site/*' | grep -v 'sources\|javadoc'); do
            cp "$jar" release/
          done
          echo "Release artifacts:"
          ls -lh release/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
          retention-days: 30

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Generate release notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "## Release ${TAG_NAME}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Artifacts" >> release-notes.md
          for f in release/*.jar; do
            name=$(basename "$f")
            size=$(ls -lh "$f" | awk '{print $5}')
            echo "- \`${name}\` (${size})" >> release-notes.md
          done
          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "\`\`\`xml" >> release-notes.md
          echo "<dependency>" >> release-notes.md
          echo "    <groupId>io.o11y.kit</groupId>" >> release-notes.md
          echo "    <artifactId>o11y-kit-spring-boot-starter</artifactId>" >> release-notes.md
          echo "    <version>${TAG_NAME#v}</version>" >> release-notes.md
          echo "</dependency>" >> release-notes.md
          echo "\`\`\`" >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false

  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download order-demo JAR
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/observable-microservice
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
