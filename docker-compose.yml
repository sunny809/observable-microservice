version: '3.8'
services:
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: order-service-jaeger
    ports:
      - '6831:6831/udp'
      - '6832:6832/udp'
      - '16686:16686'
      - '4317:4317'
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'

  postgres:
    image: postgres:16-alpine
    container_name: order-service-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    volumes:
      - postgres-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order-service-zookeeper
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order-service-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data

  tms-mock:
    image: mockserver/mockserver:5.15.0
    container_name: order-service-tms-mock
    ports:
      - '8083:1080'
    environment:
      MOCKSERVER_SERVER_PORT: 1080

volumes:
  postgres-data:
  kafka-data:
